openapi: 3.0.3
info:
  title: MS1 Addition Contract
  version: 1.0.0
paths:
  /ms1/add:
    get:
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: string
            enum:
              - "5"
          example: "5"
        - name: b
          in: query
          required: true
          schema:
            type: string
            enum:
              - "10"
          example: "10"
      responses:
        "200":
          description: Addition result
          content:
            "text/plain;charset=UTF-8":
              schema:
                type: string
                enum:
                  - "MS 1.1 - Addition = 15"
              example: "MS 1.1 - Addition = 15"
